plugins { id 'com.android.application' }

// 签名口令只存在于工作区之外的 properties 文件里；文件不存在时退回 debug 签名。
def ksProps = new Properties()
def ksFile = file(System.getenv('SMSRECV_KEYSTORE_PROPS') ?: 'D:/android/keys/smsrecv-release.properties')
def hasReleaseKey = ksFile.isFile()
if (hasReleaseKey) {
    ksFile.withInputStream { ksProps.load(it) }
}

android {
    namespace 'com.elysia.smsrecv'
    compileSdk 35

    defaultConfig {
        applicationId "com.elysia.smsrecv"
        minSdk 26
        targetSdk 30
        versionCode 2
        versionName "0.2.0"
    }

    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint { abortOnError false }
}
