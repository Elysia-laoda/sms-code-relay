plugins { id 'com.android.application' }

// 签名：口令只存在于工作区之外的 properties 文件里，工程里不留任何口令。
// 位置可用环境变量 SMSRELAY_KEYSTORE_PROPS 覆盖；文件不存在时退回 debug 签名，保证还能出包。
def ksProps = new Properties()
def ksFile = file(System.getenv('SMSRELAY_KEYSTORE_PROPS') ?: 'D:/android/keys/smsrelay-release.properties')
def hasReleaseKey = ksFile.isFile()
if (hasReleaseKey) {
    ksFile.withInputStream { ksProps.load(it) }
}

android {
    namespace 'com.elysia.smsrelay'
    compileSdk 35

    defaultConfig {
        applicationId "com.elysia.smsrelay"
        minSdk 26
        targetSdk 33
        versionCode 2
        versionName "0.2.0"
    }

    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint { abortOnError false }
}
